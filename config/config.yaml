# 应用静态配置（敏感项请用环境变量，见 env_bindings）

env_keys:
  app_env: APP_ENV
  env_fallback: ENV
  log_level: LOG_LEVEL
  log_enable_file: LOG_ENABLE_FILE
  service_name: SERVICE_NAME

defaults:
  app_env: dev
  log_level_dev: DEBUG
  log_level_prod: INFO
  log_enable_file: "true"
  service_name: customer-service-agent

# 环境变量绑定：新增可配置项时在此追加一条，无需改 Python
# resolver: app_env | bool
# default / default_alt + alt_when: 按 app_env 选用不同默认值
env_bindings:
  app_env:
    resolver: app_env
  log_level:
    env: LOG_LEVEL
    default: defaults.log_level_dev
    default_alt: defaults.log_level_prod
    alt_when:
      field: app_env
      not_in: [dev, test]
    upper: true
  log_enable_file:
    env: LOG_ENABLE_FILE
    default: defaults.log_enable_file
    resolver: bool
  service_name:
    env: SERVICE_NAME
    default: defaults.service_name
  mysql.host:
    env: MYSQL_HOST
  mysql.port:
    env: MYSQL_PORT
    default: mysql.port
    cast: int
  mysql.user:
    env: MYSQL_USER
    default: mysql.user
  mysql.password:
    env: MYSQL_PASSWORD
  mysql.db:
    env: MYSQL_DB
    default: mysql.db
  mysql.tracker_table_name:
    env: MYSQL_TRACKER_TABLE_NAME
    default: mysql.tracker_table_name

business:
  default_sender_id: default
  default_encoding: utf-8

actions:
  listen: action_listen
  restart: action_restart
  session_start: action_session_start
  default_fallback: action_default_fallback
  deactivate_loop: action_deactivate_loop
  back: action_back

slots:
  type_any: any

mysql:
  port: 3306
  user: root
  db: ecs
  tracker_table_name: trackers
