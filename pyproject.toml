# 项目基础信息
[project]
# 发布/安装时使用的项目名称
name = "customer-service-agent"
# 当前项目版本
version = "0.1.0"
# Python 版本约束（固定 3.12 系列）
requires-python = ">=3.12,<3.13"
# 项目简要描述
description = "Customer Service Agent"
# 项目说明文档
readme = "README.md"

# 运行时依赖（按功能分组注释）
dependencies = [
    # CLI 与基础能力
    "aiohttp>=3.8.0,<4.0.0",           # 异步 HTTP 客户端
    "click>=8.0.0,<9.0.0",             # CLI 框架
    "colorama>=0.4.0,<1.0.0",          # 终端颜色支持
    "python-dotenv>=1.0.0,<2.0.0",     # 环境变量加载
    "rich>=10.0.0,<15.0.0",            # 终端美化输出
    "tqdm>=4.60.0,<5.0.0",             # 进度条
    "typing-extensions>=4.0.0",        # 类型扩展

    # Web API
    "fastapi>=0.100.0,<1.0.0",         # FastAPI 框架
    "uvicorn>=0.20.0,<1.0.0",          # ASGI 服务
    "httpx>=0.24.0,<1.0.0",            # 现代 HTTP 客户端
    "python-socketio>=5.0.0,<6.0.0",   # WebSocket 通讯

    # LLM 与编排
    "dashscope>=1.20.0",               # 阿里云 DashScope SDK
    "langchain>=0.3.0",                # LangChain 入口包
    "langchain-community>=0.3.0",      # 社区扩展
    "langchain-core>=0.3.0",           # 核心组件
    "langchain-openai>=0.2.0",         # OpenAI 集成
    "langgraph>=0.2.0",                # LangGraph 编排
    "openai>=1.0.0,<2.0.0",            # OpenAI SDK

    # 数据建模与配置
    "pydantic>=2.0.0,<3.0.0",          # 数据模型与校验
    "jinja2>=3.0.0,<4.0.0",            # 模板引擎
    "pyyaml>=6.0.0,<7.0.0",            # YAML 读写
    "ruamel-yaml>=0.17.0,<1.0.0",      # YAML 高级保真处理

    # 检索与存储
    "numpy>=1.24.0,<3.0.0",            # 数值计算
    "sentence-transformers>=2.2.0",    # 本地向量嵌入
    "sqlalchemy>=2.0.0,<3.0.0",        # ORM 与数据库访问
]

# 依赖分层说明：
# - production（生产环境）= [project].dependencies（默认安装）
# - development（开发环境）= [dependency-groups].dev（按需安装）
[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",            # 单元测试
    "pytest-asyncio>=0.23.0,<1.0.0",   # 异步测试支持
    "ruff>=0.5.0,<1.0.0",              # 代码检查与格式化
    "mypy>=1.10.0,<2.0.0",             # 静态类型检查
]

# 可执行命令入口（安装后可直接调用命令名）
[project.scripts]
# 项目主命令：统一 CLI 入口
csa = "app.__main__:main" # 主入口

# 预留命令（对应 app/cli 下模块；实现 main() 后可取消注释启用）
# csa-init = "app.cli.init:main"       # 初始化命令
# csa-run = "app.cli.run:main"         # 运行命令
# csa-train = "app.cli.train:main"     # 训练命令
# csa-shell = "app.cli.shell:main"     # 交互 Shell
# csa-inspect = "app.cli.inspect:main" # 调试命令

# uv 项目行为配置
[tool.uv]
# 以“可安装包”模式处理当前项目，确保 scripts 能安装
package = true

# PEP 517 构建系统配置
[build-system]
# 构建后端依赖
requires = ["setuptools>=68.0"]
# 使用 setuptools 作为构建后端
build-backend = "setuptools.build_meta"

# setuptools 包发现规则
[tool.setuptools.packages.find]
# 仅打包 app 命名空间，避免误收录其它目录
include = ["app*"]
